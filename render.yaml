# render.yaml — ShopNest single-service deployment (Free Tier)
# Render auto-detects this file and uses it for Blueprint deploys.
# NOTE: Free tier spins down after inactivity (~15 min).
#       No persistent disks, SSH, scaling, or one-off jobs.

services:
  - type: web
    name: shopnest
    runtime: docker
    repo: https://github.com/rnithish18/E-commerce-Inventory-Management-platform
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: shopnest-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://shopnest.onrender.com
      - key: PUBLIC_URL
        value: https://shopnest.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MOCK_GATEWAY
        value: "true"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_FILE_SIZE_MB
        value: "5"

databases:
  - name: shopnest-db
    plan: free
    databaseName: shopnest_db
    user: shopnest
