<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="140" fill="#38bdf8" opacity="0.06"/>
  <circle cx="200" cy="200" r="100" fill="#38bdf8" opacity="0.08"/>

  <!-- Product Silhouette / Art -->
  <g filter="url(#glow)">
    
        <rect x="135" y="90" width="130" height="220" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
        <rect x="145" y="105" width="110" height="190" rx="16" fill="#1e293b"/>
        <circle cx="200" cy="115" r="5" fill="#38bdf8"/>
        <rect x="160" y="170" width="80" height="60" rx="8" fill="#38bdf8" opacity="0.3"/>
      
  </g>

  <!-- Category & Label Ribbon -->
  <rect x="24" y="24" width="100" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="74" y="41" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">Electronics</text>

  <!-- Product Name Preview at bottom -->
  <text x="200" y="360" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">
    Apple iPhone 15 128GB Blue
  </text>
</svg>