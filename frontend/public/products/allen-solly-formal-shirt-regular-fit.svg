    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#60a5fa" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
