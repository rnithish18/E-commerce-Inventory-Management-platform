<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="560" height="560" rx="24" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Center Aperture / Camera Icon -->
  <g transform="translate(300, 250)">
    <!-- Ambient Circle Glow -->
    <circle r="90" fill="#f97316" fill-opacity="0.06" filter="url(#glow)" />
    <circle r="72" fill="#0f172a" stroke="#334155" stroke-width="3" />

    <!-- Camera Body -->
    <path d="M -42 -22 L -28 -22 L -20 -32 L 20 -32 L 28 -22 L 42 -22 C 48 -22 52 -18 52 -12 L 52 28 C 52 34 48 38 42 38 L -42 38 C -48 38 -52 34 -52 28 L -52 -12 C -52 -18 -48 -22 -42 -22 Z"
          fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Lens -->
    <circle cx="0" cy="8" r="22" fill="#090e1a" stroke="#f97316" stroke-width="3" />
    <circle cx="0" cy="8" r="14" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="-5" cy="3" r="4" fill="#38bdf8" fill-opacity="0.8" />
    
    <!-- Flash LED -->
    <circle cx="34" cy="-8" r="4" fill="#fdba74" />
  </g>

  <!-- Status Badge -->
  <g transform="translate(300, 390)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="url(#badgeGrad)" filter="url(#glow)" fill-opacity="0.2" />
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#0f172a" stroke="#f97316" stroke-width="1.5" />
    <text x="0" y="5" fill="#fdba74" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">
      PHOTO COMING SOON
    </text>
  </g>

  <!-- Explanatory Subtext -->
  <text x="300" y="450" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    Verified manufacturer imagery being curated
  </text>
  <text x="300" y="474" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">
    ShopNest Authentic Product Guarantee
  </text>

  <!-- Watermark brand at bottom -->
  <g transform="translate(300, 535)">
    <text x="0" y="0" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">
      SHOPNEST VERIFIED
    </text>
  </g>
</svg>
